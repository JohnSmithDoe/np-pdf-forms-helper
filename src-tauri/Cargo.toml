[package]
name = "np-office-document-helper"
version = "2.0.1"
description = "Copy and fill xlsx and pdf documents with the same input data"
authors = ["leto the c0dem0nkey"]
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The document store is an insertion-ordered JSON object, and that order IS the
# order the UI lists documents in. A BTreeMap would silently re-sort every
# existing install by UUID on first write; a HashMap would scramble it.
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
umya-spreadsheet = "3.1.0"
# The patch writer copies untouched entries of a customer's workbook as raw
# compressed bytes; same version and features as umya's own, so one build.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
lopdf = { version = "0.36.0", default-features = false }

# umya unoptimised parses the master's fill-down sheets far too slowly for
# `tauri dev`; only dependencies are optimised, the app crate stays quick to build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
