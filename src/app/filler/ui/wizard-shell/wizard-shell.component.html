<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Menü öffnen" />
    </ion-buttons>
    <ion-title>{{ heading() }}</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-progress-bar
      [value]="progress()"
      role="progressbar"
      [attr.aria-valuenow]="step()"
      aria-valuemin="1"
      [attr.aria-valuemax]="stepCount()"
      [attr.aria-label]="'Schritt ' + step() + ' von ' + stepCount()"
    />
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-note class="wizard-shell__step">
    Schritt {{ step() }} von {{ stepCount() }}
  </ion-note>
  <ng-content />
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="start">
      @if (showBack()) {
        <ion-button fill="clear" (click)="back.emit()">
          <ion-icon
            slot="start"
            name="chevron-back-outline"
            aria-hidden="true"
          />
          {{ backLabel() }}
        </ion-button>
      }
    </ion-buttons>
    <ion-buttons slot="end">
      <ng-content select="[wizardFooter]" />
      @if (showNext()) {
        <ion-button
          strong="true"
          [color]="nextColor()"
          [disabled]="nextDisabled()"
          (click)="next.emit()"
        >
          {{ nextLabel() }}
          <ion-icon
            slot="end"
            name="chevron-forward-outline"
            aria-hidden="true"
          />
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
