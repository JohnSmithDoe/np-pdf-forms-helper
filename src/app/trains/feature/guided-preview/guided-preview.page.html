<app-wizard-shell
  class="ion-page"
  heading="Zeilen prüfen"
  [step]="2"
  [stepCount]="3"
  backLabel="Verwerfen"
  [nextLabel]="includedCount() + ' Zeile(n) übernehmen'"
  nextColor="success"
  [nextDisabled]="!includedCount()"
  (back)="onDiscard()"
  (next)="onCommit()"
>
  @if (facade.staging(); as staging) {
    <ion-note class="guided-preview__file" data-testid="guided-preview-file">
      {{ staging.file }} · {{ staging.summary.total }} Datenzeile(n)
    </ion-note>
  }
  <app-row-preview />
</app-wizard-shell>

<app-busy-overlay [busy]="facade.busy()" />
