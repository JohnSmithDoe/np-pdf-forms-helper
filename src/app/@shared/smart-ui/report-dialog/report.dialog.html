<ion-header>
  <ion-toolbar>
    <ion-title role="heading" aria-level="1">{{ report().headline }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <app-report-view [report]="report()" (openFolder)="openFolder($event)" />
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button strong="true" color="success" (click)="close()">
        Schließen
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
