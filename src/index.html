<!doctype html>
<!-- ─── why ─────────────────────────────────────────────────────────
     No theme attribute to set: colour is Ionic's, and dark mode comes from
     `palettes/dark.system.css`, which keys off `prefers-color-scheme`. The
     `color-scheme` meta below is what lets the OS paint the scrollbars and
     form controls to match.
     `base href` stays relative because the packaged build is served to the webview over
     `file://`, where an absolute `/` resolves to the filesystem root.
     ───────────────────────────────────────────────────────────────── -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>npDokumentenhilfe</title>

    <base href="./" />

    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kopiert und füllt PDF- und XLSX-Formulare mit denselben Eingabedaten."
    />

    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        margin: auto;
        max-width: 60vw;
        max-height: 60vh;
      }
    </style>
  </head>

  <body>
    <app-root>
      <img
        id="app-splash"
        src="assets/splash.png"
        alt="npDokumentenhilfe wird geladen"
      />
    </app-root>
    <noscript>
      Bitte aktiviere JavaScript, um diese Anwendung zu nutzen.
    </noscript>
  </body>
</html>
