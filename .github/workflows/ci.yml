# One job, because CI is a backstop: lefthook's pre-push hook already runs
# `lint` + `verify`, so nothing here is on anyone's critical path. Fanning the
# gates out across jobs would cost a full reinstall each to buy wall-clock
# nobody waits on.
#
# Four things this file cannot say in YAML:
#   - The default branch is `master`, not `main` (`git branch -a`:
#     origin/HEAD -> origin/master). The remote also carries `release`, but it has
#     diverged and trails master by a version, so it is a distribution branch and
#     not somewhere work lands — anything aimed at it arrives here as a pull
#     request anyway.
#   - ubuntu-latest verifies a product that ships on WINDOWS and macOS. Every gate
#     below is platform-independent — eslint, prettier, sheriff and tsc read source,
#     and the Angular build emits the same bundle everywhere — so the cheapest
#     runner is the honest one. That stops being true for PACKAGING: see the
#     release seam at the bottom of this file.
#   - `v*` rather than a semver glob, so a pre-release tag is verified and packaged
#     too. The shape assertion lives in `package`: the tag must equal the version
#     the binary carries.
#   - setup-node's `cache: pnpm` is unusable: it runs before corepack has made pnpm
#     exist. Hence the explicit cache step.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  # An installer on demand, without cutting a tag: `package` then uploads a
  # workflow artifact and publishes nothing.
  workflow_dispatch:

# GitHub defaults this off — an omitted block means superseded pushes run to
# completion. Tags are exempt so a future release job can never be cancelled
# half-way through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Naming any scope sets every unnamed one to none.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc pins 22; package.json's `preinstall` (scripts/check-node.mjs) fails
      # the install outright below engines.node (>=22.18), so a stale .nvmrc shows
      # up here as a loud install failure rather than a confusing lint error.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Corepack reads the pinned pnpm version out of package.json's packageManager.
      - name: Activate pnpm
        run: corepack enable pnpm

      - uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # No --ignore-scripts, deliberately: pnpm-workspace.yaml's `allowBuilds` is
      # a deny-by-default allowlist that pnpm ERRORS on rather than warns, so an
      # unlisted new postinstall must fail here — that is the check, and
      # --ignore-scripts would hide it.
      - run: pnpm install --frozen-lockfile

      # Through the scripts, never a glob restated here, so linting by hand cannot
      # cover less than CI does. `lint` chains stylelint after eslint, which cannot
      # read SCSS at all.
      - name: Lint (eslint + stylelint)
        run: pnpm run lint

      # Enforced by the pre-commit hook too, which `--no-verify` skips wholesale.
      - name: Format (prettier)
        run: pnpm run format:check

      # Sheriff's ladder (ui may not reach data, smart-ui is a leaf, util is pure)
      # is a property of the whole import graph, so unlike eslint it cannot be run
      # per-file at commit time — a legal-looking file can be what makes an illegal
      # edge.
      - name: Module boundaries (sheriff)
        run: pnpm run verify

      # The build below compiles only what `src/main.ts` reaches (tsconfig.app.json
      # is roots-not-globs, on purpose), so a component nothing imports yet is
      # seen by the build not at all. This gate globs src/** so that is not a
      # blind spot. ngc rather than tsc: strictTemplates is where these actually
      # break, and tsc would call a component clean with a broken template.
      - name: Type-check (whole app, incl. unwired components)
        run: pnpm run typecheck

      # Last, because it is the slowest and everything above localises a failure
      # better. `production` is already angular.json's defaultConfiguration — named
      # anyway so the gate cannot weaken silently if that default ever changes. Not
      # `pnpm run build`: its `--base-href ./` is a packaging concern for the
      # webview, irrelevant to whether the app compiles.
      - name: Production build (angular)
        run: pnpm exec ng build --configuration production

      # Opens the build above under the packaged app's CSP (e2e/release/serve.ts).
      # v2.0.1 shipped unstyled because nothing ever loaded this artefact: the
      # CSP and the critical-CSS inlining exist only here, not under `ng serve`.
      # `channel: 'chrome'` uses the runner's preinstalled Chrome, no download.
      - name: Release build under the shipped CSP (playwright)
        run: pnpm exec playwright test --config playwright.release.config.ts

      # The rest of the Playwright suite in e2e/ is NOT wired in here yet: it has
      # never been run anywhere but a developer machine. Adding it is a
      # deliberate step, not a drive-by.

  # Packaging runs on a NATIVE Windows runner, never cross-compiled: the NSIS
  # bundle and the MSVC link need the host toolchain. Only on a `v*` tag (draft
  # release) or a manual run (artifact only) — a Windows release build is ~10
  # minutes and no push needs it. `contents: write` is granted HERE and nowhere
  # else, so `verify`, which runs on every pull request, never holds a token
  # that can publish.
  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Activate pnpm
        run: corepack enable pnpm

      # Asked rather than assumed: pnpm's store lives under %LOCALAPPDATA% on
      # Windows, so a hard-coded `~/.pnpm-store` would cache an empty folder.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-windows-

      - run: pnpm install --frozen-lockfile

      # The release profile is LTO + codegen-units=1, so a cold build is most of
      # this job's wall-clock. Caches ~/.cargo and src-tauri/target, keyed on
      # Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The version is written in three files and the installer is named after
      # tauri.conf.json's. A tag that disagrees with any of them ships a file
      # whose name lies about its contents, so it fails here, before ten minutes
      # of compiling.
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$crate"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$conf" ] && [ "$tag" = "$crate" ]

      # The only place `cargo test` runs on the platform the app ships on — the
      # pre-push hook runs it on the macOS dev machine. Paths, line endings and
      # file locking are where Windows differs, and the tests touch all three.
      - name: Rust tests (Windows)
        run: pnpm run rust:test

      # `--bundles nsis` because tauri.conf.json also lists `dmg`, which cannot
      # be built off a Mac. beforeBuildCommand runs `pnpm run build` itself.
      - name: Bundle (NSIS)
        run: pnpm tauri build --bundles nsis

      # Two files: the installer (per-user, no admin rights) and the bare exe,
      # which runs from any folder and keeps ./data beside itself. The bare exe
      # relies on the WebView2 runtime that Windows 10/11 already ship.
      - name: Collect
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/np-office-document-helper.exe "out/npDokumentenhilfe_${version}_x64-portable.exe"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: npDokumentenhilfe-windows
          path: out/*.exe
          if-no-files-found: error

      # A DRAFT, so publishing stays a human click after the files have been
      # looked at. `gh` ships on the runner, so no third-party action holds the
      # write token. Create-if-absent plus `--clobber` makes re-running a failed
      # tag safe instead of an "already exists" error.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" out/*.exe --clobber
